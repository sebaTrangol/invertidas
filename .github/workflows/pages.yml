name: Deploy Pages (main + qa preview)

on:
  push:
    branches: [main, qa]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout qa
        uses: actions/checkout@v4
        with:
          ref: qa
          path: qa

      - name: Assemble site (main at root, qa preview at /qa/)
        run: |
          mkdir -p _site/qa
          cp -r main/. _site/
          cp -r qa/. _site/qa/
          rm -rf _site/.github _site/qa/.github

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
